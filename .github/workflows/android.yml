name: KC LMS Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK package and signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          test -f "$APK" || { echo "APK missing"; exit 1; }
          test -x "$AAPT" || { echo "aapt missing"; exit 1; }
          test -x "$APKSIGNER" || { echo "apksigner missing"; exit 1; }

          echo "===== APK PACKAGE METADATA ====="
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/kc-lms-badging.txt"
          sed -n '1,8p' "$RUNNER_TEMP/kc-lms-badging.txt"

          echo "===== APK SIGNATURE VERIFICATION ====="
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KC-LMS-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
